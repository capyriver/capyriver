<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Soup Training Monitor — animated pixel-art banner</title>
  <desc id="desc">The Soup title falls softly into place while steam curls above a gently simmering bowl.</desc>
  <image href="https://raw.githubusercontent.com/Feruum/SoupTask/main/assets/readme/soup-cover.png" x="0" y="0" width="1200" height="400" preserveAspectRatio="none" />

  <!-- Replace the still title/steam regions so the original art remains crisp underneath. -->
  <rect x="42" y="88" width="430" height="190" fill="#100e0c" />
  <rect x="806" y="10" width="158" height="108" fill="#100e0c" />

  <!-- Staggered title drop and settle. -->
  <g fill="#f6e5c5" font-family="Georgia, 'Times New Roman', serif" font-size="132" font-weight="700">
    <text x="55" y="225">S<animateTransform attributeName="transform" type="translate" values="0,-46;0,5;0,-2;0,0" keyTimes="0;0.62;0.82;1" keySplines="0.2 0.8 0.2 1;0.3 0 0.7 1;0.2 0 0.8 1" calcMode="spline" dur="0.82s" begin="0.08s" fill="freeze" /></text>
    <text x="148" y="225">o<animateTransform attributeName="transform" type="translate" values="0,-46;0,5;0,-2;0,0" keyTimes="0;0.62;0.82;1" keySplines="0.2 0.8 0.2 1;0.3 0 0.7 1;0.2 0 0.8 1" calcMode="spline" dur="0.82s" begin="0.20s" fill="freeze" /></text>
    <text x="237" y="225">u<animateTransform attributeName="transform" type="translate" values="0,-46;0,5;0,-2;0,0" keyTimes="0;0.62;0.82;1" keySplines="0.2 0.8 0.2 1;0.3 0 0.7 1;0.2 0 0.8 1" calcMode="spline" dur="0.82s" begin="0.32s" fill="freeze" /></text>
    <text x="324" y="225">p<animateTransform attributeName="transform" type="translate" values="0,-46;0,5;0,-2;0,0" keyTimes="0;0.62;0.82;1" keySplines="0.2 0.8 0.2 1;0.3 0 0.7 1;0.2 0 0.8 1" calcMode="spline" dur="0.82s" begin="0.44s" fill="freeze" /></text>
    <text x="412" y="225">.<animateTransform attributeName="transform" type="translate" values="0,-46;0,5;0,-2;0,0" keyTimes="0;0.62;0.82;1" keySplines="0.2 0.8 0.2 1;0.3 0 0.7 1;0.2 0 0.8 1" calcMode="spline" dur="0.82s" begin="0.56s" fill="freeze" /></text>
  </g>
  <text x="62" y="263" fill="#f6e5c5" font-family="Arial, sans-serif" font-size="19" letter-spacing="7">TRAINING MONITOR</text>

  <!-- Pixel-stepped steam curls; the loop is calm and intentionally subtle. -->
  <g fill="none" stroke="#f5e4c5" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M828 111V91H817V70H828V49H839V25">
      <animateTransform attributeName="transform" type="translate" values="0,0;2,-4;-1,-8;0,0" keyTimes="0;0.33;0.67;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.78;1;0.82;0.78" keyTimes="0;0.35;0.72;1" dur="2.8s" repeatCount="indefinite" />
    </path>
    <path d="M874 111V76H885V55H874V34H885V11">
      <animateTransform attributeName="transform" type="translate" values="0,0;-1,-5;2,-9;0,0" keyTimes="0;0.33;0.67;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" dur="3.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.76;0.94;1;0.76" keyTimes="0;0.35;0.72;1" dur="3.1s" repeatCount="indefinite" />
    </path>
    <path d="M922 111V91H911V69H922V47H933V25">
      <animateTransform attributeName="transform" type="translate" values="0,0;1,-4;-2,-8;0,0" keyTimes="0;0.33;0.67;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" dur="2.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;1;0.86;0.8" keyTimes="0;0.35;0.72;1" dur="2.6s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Small bubbles rise and disappear inside the broth. -->
  <g fill="#f6e5c5">
    <rect x="797" y="154" width="5" height="5" opacity="0">
      <animate attributeName="y" values="154;145;137" dur="1.7s" begin="0s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.45;1" dur="1.7s" begin="0s" repeatCount="indefinite" />
    </rect>
    <rect x="905" y="163" width="4" height="4" opacity="0">
      <animate attributeName="y" values="163;153;146" dur="1.9s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.65;0" keyTimes="0;0.45;1" dur="1.9s" begin="0.8s" repeatCount="indefinite" />
    </rect>
    <rect x="858" y="145" width="4" height="4" opacity="0">
      <animate attributeName="y" values="145;138;132" dur="1.6s" begin="1.25s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.55;0" keyTimes="0;0.45;1" dur="1.6s" begin="1.25s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
